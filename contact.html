<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact TeamOne</title>
    <meta name="description" content="Contact TeamOne for website development, college projects, or technical collaboration.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">Team<span>One</span></h2>
        <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="ankit.html">Ankit</a></li>
            <li><a href="anubhav.html">Anubhav</a></li>
            <li><a href="shivam.html">Shivam</a></li>
            <li><a href="manish.html">Manish</a></li>
            <li><a href="why-hire-us.html">Why Hire Us?</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="section">
    <h2>Contact Our Team</h2>

    <p>
        Have a project, website idea, or collaboration proposal? Fill in
        the form below with your details and we will get back to you.
    </p>

    <form class="contact-form" id="contactForm">

        <input
            type="text"
            id="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Your Email"
            required
        >

        <input
            type="text"
            id="project"
            placeholder="Project Title"
            required
        >

        <select id="projectType" required>
            <option value="">Select Project Type</option>
            <option value="Website Development">Website Development</option>
            <option value="College Project">College Project</option>
            <option value="Technical Collaboration">Technical Collaboration</option>
            <option value="Other">Other</option>
        </select>

        <textarea
            id="message"
            placeholder="Describe your project or idea"
            rows="5"
            required
        ></textarea>

        <button type="submit" class="btn">Submit Enquiry</button>

        <p class="form-message" id="formMessage" aria-live="polite"></p>

    </form>
</section>

<footer>
    <p>© 2026 TeamOne | SSIPMT Raipur</p>
</footer>

<script src="script.js"></script>

<script>
    const contactForm = document.getElementById("contactForm");
    const formMessage = document.getElementById("formMessage");

    contactForm.addEventListener("submit", function(event) {
        event.preventDefault();

        formMessage.textContent =
            "Thank you! Your details were recorded. (Demo form — no email is sent yet.)";

        contactForm.reset();
    });
</script>

</body>
</html>
